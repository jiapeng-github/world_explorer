<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>世界大百科 · Flutter 页面验收</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#12243a;font:16px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}header{padding:44px max(24px,calc((100vw - 1280px)/2));background:#12395b;color:white}header small{color:#ffc18a;letter-spacing:.12em}h1{font-size:36px;margin:8px 0}p{max-width:800px;margin:12px 0}a{color:inherit}nav{position:sticky;top:0;z-index:1;background:#fff;padding:14px 24px;border-bottom:1px solid #dde5ee;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,nav a{font:inherit;border:1px solid #dde5ee;background:white;border-radius:10px;padding:8px 16px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#12395b;color:white}nav label{margin-left:auto}select{font:inherit;padding:8px;border:1px solid #dde5ee;border-radius:8px}main{max-width:1328px;margin:auto;padding:28px 24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}.grid.tablet{grid-template-columns:repeat(auto-fill,minmax(480px,1fr))}figure{margin:0;background:white;border:1px solid #dde5ee;border-radius:18px;overflow:hidden}figure img{width:100%;height:auto;display:block;aspect-ratio:390/844;object-fit:contain;background:white}.tablet figure img{aspect-ratio:1024/768}figcaption{padding:16px;border-top:1px solid #dde5ee}figcaption b{display:block}figcaption small{color:#53677d}footer{margin:40px 0;color:#53677d;font-size:14px}.note{border-left:4px solid #ff9a3d;padding:12px 16px;background:#fff0df;margin-bottom:26px}@media(max-width:550px){.grid.tablet{grid-template-columns:1fr}header{padding:28px 24px}h1{font-size:28px}}
</style>
<header><small>WORLD ATLAS / FLUTTER 0.3.0</small><h1>把设计，变成可探索的世界</h1><p>28 个页面与状态的 Flutter 运行截图。选择手机或平板，逐页核对已确认的现代地理图鉴设计。</p></header>
<nav><button aria-pressed="true" data-width="390">手机 390 × 844</button><button aria-pressed="false" data-width="1024">平板 1024 × 768</button><a href="../index.html">查看批准的原图</a><a href="http://127.0.0.1:5291/">打开可交互应用</a><label>页面 <select id="filter"><option value="all">全部模块</option><option>发现</option><option>地图</option><option>百科</option><option>风景</option><option>专题</option><option>搜索</option><option>阅读</option><option>理解</option><option>我的</option><option>家长</option></select></label></nav>
<main><p class="note">这是开发验收页。照片采用有来源的实景素材；截图来自真实 Flutter 组件。系统国旗字体和阴影在组件测试环境中可能与设备不同。完整内容与原生验证进度见<a href="../IMPLEMENTATION.md">实现记录</a>。</p><div class="grid" id="pages"></div><footer>页面能正常渲染不等于全部发布验收已完成。完整操作请打开应用，内容和测试边界以项目文档为准。</footer></main>
<script>
const pages=[['s00-welcome','兴趣引导','发现'],['s01-discover','发现首页','发现'],['s02-map','世界地图','地图'],['s03-catalog','百科目录','百科'],['s04-country','国家概览','百科'],['s05-section','国家栏目','百科'],['s06-reader','文章阅读','阅读'],['s07-place','地标详情','风景'],['s08-gallery','图片查看器','风景'],['s09-topics','专题目录','专题'],['s10-topic','专题详情','专题'],['s11-search','搜索入口','搜索'],['s12-results','分类搜索结果','搜索'],['s13-exercise','互动理解题','理解'],['s14-feedback','答案解释与回读','理解'],['s15-journal','我的探索','我的'],['s16-bookmarks','我的收藏','我的'],['s17-history','阅读足迹','我的'],['s18-notes','探索笔记','我的'],['s19-editor','笔记编辑','我的'],['s20-reading-settings','阅读设置','阅读'],['s21-parent-gate','家长入口','家长'],['s22-parent','家长中心','家长'],['s23-packs','内容包管理','家长'],['s24-pack','内容包详情','家长'],['s25-backup','备份恢复','家长'],['s26-credits','来源与许可','阅读'],['s27-rest','休息提示','家长']];
let width='390';const grid=document.querySelector('#pages'),filter=document.querySelector('#filter');function render(){grid.className='grid'+(width==='1024'?' tablet':'');grid.replaceChildren();for(const [id,title,category]of pages){if(filter.value!=='all'&&filter.value!==category)continue;const card=document.createElement('figure');const link=document.createElement('a');link.href=width+'/'+id+'.png';link.target='_blank';const img=document.createElement('img');img.src=link.href;img.alt=title+'运行截图';img.loading='lazy';link.append(img);const caption=document.createElement('figcaption');const name=document.createElement('b');name.textContent=id.slice(0,3).toUpperCase()+' · '+title;const text=document.createElement('small');text.textContent=category+' / '+(width==='390'?'手机':'平板');caption.append(name,text);card.append(link,caption);grid.append(card)}}document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{width=button.dataset.width;document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',b===button));render()});filter.onchange=render;render();
</script>
</html>
